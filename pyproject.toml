[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentl"
version = "0.1.0"
description = "A runnable, testable and extensible ReAct agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools]
packages = ["agentl"]
package-dir = { agentl = "." }
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
